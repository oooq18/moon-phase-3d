<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>观月</title>
    <meta
      name="description"
      content="以 astronomy-engine 计算东八区此刻的真实月相，并在三维月球上呈现光照。"
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="%BASE_URL%assets/moon/lroc_color.jpg" />
    <link rel="preload" as="image" href="%BASE_URL%assets/moon/ldem_bump.png" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="brand">
      <h1>观月</h1>
    </header>

    <div id="webgl-error" class="webgl-error" hidden>
      <p>无法创建三维场景。</p>
      <p>月相数据仍可在下方查看。</p>
    </div>

    <section class="hud" id="panel" data-page="observe" aria-label="月相">
      <p id="fallback" class="fallback" hidden>月面贴图未能载入，已改用程序化月面。</p>

      <div class="page-observe" id="page-observe" role="tabpanel" aria-labelledby="tab-observe">
        <div class="info">
          <p class="eyebrow" id="eyebrow" hidden>中秋</p>
          <h2 id="phase-name" class="phase-name">—</h2>
          <p class="poem" id="poem" hidden>
            <span id="poem-line"></span><span id="poem-author" class="poem-author"></span>
          </p>
        </div>
        <div id="date-slot-observe" class="date-slot">
          <div class="nav" id="date-nav" role="group" aria-label="日期">
            <button type="button" id="prev" class="glyph" aria-label="前一天">‹</button>
            <label class="date-field">
              <span class="sr-only">选择日期，按北京时间解析</span>
              <input id="date" type="date" min="1000-01-01" max="9999-12-31" autocomplete="off" />
            </label>
            <button type="button" id="next" class="glyph" aria-label="后一天">›</button>
            <button type="button" id="today" hidden>今天</button>
          </div>
        </div>
      </div>

      <div class="sheet" id="page-dates" data-page="dates" role="tabpanel" aria-labelledby="tab-dates" hidden>
        <div class="sheet-body">
          <div class="mode-switch" role="radiogroup" aria-label="月数">
            <span class="seg-ind" aria-hidden="true"></span>
            <button type="button" id="mode-single" role="radio" aria-checked="true">单月</button>
            <button type="button" id="mode-dual" role="radio" aria-checked="false">双月</button>
          </div>

          <div class="dual-wrap" id="dual-wrap">
            <div class="people" id="people" data-mode="single">
              <div class="person is-active" data-index="0">
                <input id="name-0" class="name-field" type="text" maxlength="16" placeholder="姓名" autocomplete="off" enterkeyhint="done" aria-label="左侧姓名，可不填" />
                <label class="person-pick" id="pick-0" aria-pressed="true">
                  <span class="person-when" id="when-0"></span>
                  <input type="date" class="person-date-input" data-index="0" min="1000-01-01" max="9999-12-31" tabindex="-1" aria-hidden="true" />
                </label>
              </div>
              <div class="person" data-index="1" id="person-1">
                <input id="name-1" class="name-field" type="text" maxlength="16" placeholder="姓名" autocomplete="off" enterkeyhint="done" aria-label="右侧姓名，可不填" />
                <label class="person-pick" id="pick-1" aria-pressed="false">
                  <span class="person-when" id="when-1"></span>
                  <input type="date" class="person-date-input" data-index="1" min="1000-01-01" max="9999-12-31" tabindex="-1" aria-hidden="true" />
                </label>
              </div>
            </div>

            <p class="identity" id="identity" hidden>
              <span id="identity-0"></span>
              <span id="identity-1"></span>
            </p>
          </div>

          <div id="date-slot-dates" class="date-slot"></div>

          <dl class="metrics">
            <div>
              <dt>月龄</dt>
              <dd id="metric-age"></dd>
            </div>
            <i class="dot" aria-hidden="true"></i>
            <div>
              <dt>亮面</dt>
              <dd id="metric-illum"></dd>
            </div>
            <i class="dot" aria-hidden="true"></i>
            <div>
              <dt>地月距离</dt>
              <dd id="metric-dist"></dd>
            </div>
          </dl>
        </div>
      </div>

      <div class="sheet" id="page-share" data-page="share" role="tabpanel" aria-labelledby="tab-share" hidden>
        <div class="sheet-body">
          <p class="share-lead">留下这一轮月亮。</p>
          <p class="share-note">单月的图片带一句诗。双月没有诗，左右各写月相、名字和日期。</p>
          <button type="button" id="share">分享</button>
        </div>
      </div>

      <nav class="tabbar" role="tablist" aria-label="页面">
        <button type="button" class="tab" id="tab-observe" role="tab" data-tab="observe" aria-selected="true" aria-controls="page-observe">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.6 4.4a6.8 6.8 0 1 0 4.8 11.6 5.7 5.7 0 0 1-4.8-11.6Z"/></svg>
          <span>观月</span>
        </button>
        <button type="button" class="tab" id="tab-dates" role="tab" data-tab="dates" aria-selected="false" aria-controls="page-dates">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="5.5" width="15" height="14" rx="2"/><path d="M4.5 10h15M8 3.8v3.4M16 3.8v3.4"/></svg>
          <span>日子</span>
        </button>
        <button type="button" class="tab" id="tab-share" role="tab" data-tab="share" aria-selected="false" aria-controls="page-share">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.2v9.2M8.4 7.8 12 4.2l3.6 3.6"/><path d="M6.2 13.2V18a1.6 1.6 0 0 0 1.6 1.6h8.4A1.6 1.6 0 0 0 17.8 18v-4.8"/></svg>
          <span>分享</span>
        </button>
      </nav>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
