<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>观月 · 月相观测台</title>
    <meta
      name="description"
      content="以 astronomy-engine 计算东八区此刻的真实月相，并在三维月球上呈现光照。"
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="brand">
      <p class="brand-kicker">观测台</p>
      <h1>观月</h1>
      <p class="brand-sub">月相 · 东八区</p>
    </header>

    <div id="webgl-error" class="webgl-error" hidden>
      <p>无法创建三维场景。</p>
      <p>月相数据仍可在下方查看。</p>
    </div>

    <section class="panel" id="panel" aria-label="月相信息">
      <p id="fallback" class="fallback" hidden>月面贴图未能载入，已改用程序化月面。</p>
      <div class="panel-top">
        <div>
          <p class="eyebrow">月相名称</p>
          <h2 id="phase-name" class="phase-name">—</h2>
        </div>
        <time id="when" class="when">—</time>
      </div>
      <dl class="metrics">
        <div>
          <dt>月龄</dt>
          <dd id="metric-age">—</dd>
        </div>
        <div>
          <dt>亮面比例</dt>
          <dd id="metric-illum">—</dd>
        </div>
        <div>
          <dt>地月距离</dt>
          <dd id="metric-dist">—</dd>
        </div>
      </dl>
      <div class="controls">
        <button type="button" id="prev">前一天</button>
        <label class="date-field">
          <span class="sr-only">选择日期，按北京时间解析</span>
          <input id="date" type="date" autocomplete="off" />
        </label>
        <button type="button" id="next">后一天</button>
        <button type="button" id="today" hidden>今天</button>
      </div>
      <footer class="credit">
        <button type="button" id="credit-toggle" class="credit-toggle" aria-expanded="false" aria-controls="credit-body">
          版权
        </button>
        <p id="credit-body" class="credit-body">
          月球色彩与高程：NASA 戈达德太空飞行中心科学可视化工作室，CGI Moon Kit（SVS-4720）。色彩来自月球勘测轨道器相机（LROC），高程来自月球轨道激光高度计（LOLA）。美国政府作品，公有领域。
        </p>
      </footer>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
