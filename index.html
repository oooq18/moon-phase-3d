<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>观月 · 月相观测台</title>
    <meta
      name="description"
      content="以 astronomy-engine 计算东八区此刻的真实月相，并在三维月球上呈现光照。"
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="%BASE_URL%assets/moon/lroc_color.jpg" />
    <link rel="preload" as="image" href="%BASE_URL%assets/moon/ldem_bump.png" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="brand">
      <p class="brand-mark">观测台</p>
      <h1>观月</h1>
    </header>

    <div id="webgl-error" class="webgl-error" hidden>
      <p>无法创建三维场景。</p>
      <p>月相数据仍可在下方查看。</p>
    </div>

    <section class="hud" id="panel" aria-label="月相信息">
      <p id="fallback" class="fallback" hidden>月面贴图未能载入，已改用程序化月面。</p>

      <div class="caption">
        <p class="eyebrow" id="eyebrow">月相</p>
        <h2 id="phase-name" class="phase-name">—</h2>
        <p class="poem" id="poem" hidden>
          <span id="poem-line"></span><span id="poem-author" class="poem-author"></span>
        </p>
        <p class="identity" id="identity" hidden>
          <span id="identity-0"></span>
          <span id="identity-1"></span>
        </p>
      </div>

      <dl class="metrics">
        <div>
          <dt>月龄</dt>
          <dd id="metric-age">—</dd>
        </div>
        <div>
          <dt>亮面比例</dt>
          <dd id="metric-illum">—</dd>
        </div>
        <div>
          <dt>地月距离</dt>
          <dd id="metric-dist">—</dd>
        </div>
      </dl>

      <div class="dock">
        <div class="mode-switch" role="radiogroup" aria-label="月数">
          <button type="button" id="mode-single" role="radio" aria-checked="true">单月</button>
          <button type="button" id="mode-dual" role="radio" aria-checked="false">双月</button>
        </div>
        <div class="people" id="people" data-mode="single">
          <div class="person is-active" data-index="0">
            <input id="name-0" class="name-field" type="text" maxlength="16" placeholder="姓名" autocomplete="off" enterkeyhint="done" aria-label="左侧姓名，可不填" />
            <button type="button" class="person-pick" id="pick-0" aria-pressed="true">
              <span class="person-when" id="when-0"></span>
            </button>
          </div>
          <div class="person" data-index="1" id="person-1">
            <input id="name-1" class="name-field" type="text" maxlength="16" placeholder="姓名" autocomplete="off" enterkeyhint="done" aria-label="右侧姓名，可不填" />
            <button type="button" class="person-pick" id="pick-1" aria-pressed="false">
              <span class="person-side">右</span>
              <span class="person-when" id="when-1"></span>
            </button>
          </div>
        </div>
      <div class="cluster" role="group" aria-label="日期">
        <div class="control-nav" id="control-nav">
          <button type="button" id="prev">前一天</button>
          <label class="date-field">
            <span class="sr-only">选择日期，按北京时间解析，从 1000年1月1日到 9999年12月31日</span>
            <input id="date" type="date" min="1000-01-01" max="9999-12-31" autocomplete="off" />
          </label>
          <button type="button" id="next">后一天</button>
        </div>
        <div class="control-extra">
          <button type="button" id="today" hidden>今天</button>
          <button type="button" id="share">分享</button>
        </div>
      </div>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
